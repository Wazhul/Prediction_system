version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
  ml_service:
    build: ./ml_service
    ports:
      - "8000:8000"
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
  ganache:
    image: trufflesuite/ganache-cli:latest
    ports:
      - "8545:8545"